# Render Blueprint: the Django API, its PostgreSQL database and the React storefront.
# Spec: https://render.com/docs/blueprint-spec
# Schema for editors and CI: https://render.com/schema/render.yaml.json
#
# No `region` is set on purpose. A region cannot change after a service or database is
# created, and these may already exist. New resources default to Oregon. If nothing has
# been created yet, add `region: frankfurt` (closer to Bishkek) to the API service and
# the database before the first Blueprint sync. The static site is served from a CDN and
# has no region.

services:
  - type: web
    name: ala-too-supermarket-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health/
    # Runs on the new image before it takes traffic. If a migration fails, the deploy is
    # cancelled and the previous version keeps serving. Needs a paid instance type.
    preDeployCommand: python manage.py migrate --noinput
    # Deploy only after every GitHub Actions check on the commit has passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_DEBUG
        value: '0'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Only custom domains. The onrender.com host name is added automatically.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # https:// origins of custom domains for Django admin. onrender.com is automatic.
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # The storefront's https:// origin, e.g. https://ala-too-supermarket-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ala-too-supermarket-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      # Render's proxy appends the client address to X-Forwarded-For.
      - key: DRF_NUM_PROXIES
        value: '1'
      # gunicorn worker processes (each runs GUNICORN_THREADS threads, default 4).
      - key: WEB_CONCURRENCY
        value: '2'

  - type: web
    name: ala-too-supermarket-web
    runtime: static
    # --include=dev: Vite and TypeScript are devDependencies and are needed to build.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - backend/**
    routes:
      # Single-page app: unknown paths load index.html. Existing files are served first.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Vite puts a content hash in every file name under /assets/.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Full API base URL, e.g. https://ala-too-supermarket-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: ala-too-supermarket-db
    plan: basic-256mb
