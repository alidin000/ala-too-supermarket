# Render Blueprint: one Docker web service and its PostgreSQL database, on the FREE plan.
# The web service serves everything on one origin: the storefront, the staff panel at
# /admin, the API at /api/ and the owner's Django admin at /backoffice/.
# Spec: https://render.com/docs/blueprint-spec
# Schema for editors and CI: https://render.com/schema/render.yaml.json
#
# Free plan limits (https://render.com/docs/free), fine for a demo, not for a real shop:
# - the web service sleeps after 15 minutes without visitors; the next visit waits ~1 min;
# - the free database expires 30 days after creation (14 more days to upgrade, then it is
#   deleted) and has no backups;
# - no pre-deploy step and no shell, so backend/start.sh migrates, creates the first owner
#   account and loads the demo catalogue when the container starts.
# To go live, see "Moving to paid plans" in the root README.
#
# Region: Frankfurt is the closest Render region to Kyrgyzstan. A region cannot change
# after a service or database is created.

services:
  - type: web
    name: ala-too-supermarket
    runtime: docker
    plan: free
    region: frankfurt
    # The image builds the storefront too, so the build context is the repository root.
    # Both paths are relative to the repository root (no rootDir is set).
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health/
    # Deploy only after every GitHub Actions check on the commit has passed. CI runs on
    # pushes to main and on pull requests, so deploy from main.
    autoDeployTrigger: checksPass
    # Changes that cannot affect the image do not trigger a deploy.
    buildFilter:
      ignoredPaths:
        - docs/**
        - '**/*.md'
        - .github/**
    envVars:
      - key: DJANGO_DEBUG
        value: '0'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Only custom domains. The onrender.com host name is added automatically.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # https:// origins of custom domains (for logins and admin forms). onrender.com is
      # added automatically.
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ala-too-supermarket-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      # Render's proxy appends the client address to X-Forwarded-For. Rate limits and the
      # staff login lockout use it. Check it once after the first deploy (README).
      - key: DRF_NUM_PROXIES
        value: '1'
      # Free instances have 512 MB of memory: one gunicorn process with 4 threads.
      - key: WEB_CONCURRENCY
        value: '1'
      # No pre-deploy step on the free plan: migrate when the container starts.
      - key: DJANGO_MIGRATE_ON_START
        value: '1'
      # The first owner account, created only if it does not exist. Render asks for both
      # when the Blueprint is created. Use a strong password and change it after the first
      # login in /backoffice/; the account is never overwritten afterwards.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Demo catalogue (fake products and prices), loaded only into an empty database.
      # Remove this variable before loading the real catalogue.
      - key: DJANGO_SEED_DEMO
        value: '1'
      # Optional, set in the dashboard when needed (see the root README):
      # DJANGO_ADMIN_PATH (default backoffice/), DJANGO_SESSION_COOKIE_AGE (default 12 h),
      # CLIENT_IP_HEADER, DJANGO_SUPERUSER_EMAIL.

databases:
  - name: ala-too-supermarket-db
    plan: free
    region: frankfurt
    # Only the web service connects, over Render's private network. No outside access.
    ipAllowList: []
