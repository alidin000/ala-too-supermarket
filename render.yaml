services:
  - type: web
    name: ala-too-supermarket-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ala-too-supermarket-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_SSLMODE
        value: require

databases:
  - name: ala-too-supermarket-db
    plan: basic-256mb
