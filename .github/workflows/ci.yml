name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test --if-present
      - run: npm run build

  backend:
    name: Backend checks and tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # The documented local setup (backend/.env.example): debug on, so no secret is
      # needed. The deploy check below switches to production settings.
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Formatting (ruff)
        run: ruff format --check .
      - run: python manage.py check
      - name: Deploy check with production settings
        env:
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: api.example.com
          CSRF_TRUSTED_ORIGINS: https://api.example.com
          CORS_ALLOWED_ORIGINS: https://shop.example.com
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            python manage.py check --deploy --fail-level WARNING
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Render creates new databases on the latest supported major version (18).
        image: postgres:18
        env:
          POSTGRES_USER: ala_too
          POSTGRES_PASSWORD: ala_too
          POSTGRES_DB: ala_too
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ala_too"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgres://ala_too:ala_too@localhost:5432/ala_too
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply on PostgreSQL
        run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 2

  deploy-config:
    name: Docker image and Render Blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate render.yaml against Render's published schema
        run: |
          pipx run check-jsonschema==0.38.2 \
            --schemafile https://render.com/schema/render.yaml.json render.yaml
      - name: Build
        run: docker build --tag ala-too-api:ci backend
      - name: Smoke test with production settings
        run: |
          docker run --detach --name api --publish 8000:8000 \
            --env DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            --env DJANGO_ALLOWED_HOSTS=localhost \
            --env DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
            --env DJANGO_MIGRATE_ON_START=1 \
            ala-too-api:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:8000/api/health/
          curl --fail --silent --show-error "http://localhost:8000/api/health/?db=1"
          # Admin CSS is served by WhiteNoise from the files collected at build time.
          curl --fail --silent --show-error --output /dev/null \
            --header 'X-Forwarded-Proto: https' \
            http://localhost:8000/static/admin/css/base.css
      - name: Container logs
        if: always()
        run: docker logs api || true
